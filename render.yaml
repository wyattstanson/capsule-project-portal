# ─── Render Blueprint — Capstone Portal (single service, free-tier friendly) ─
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick the repo.
# ONE web service (capsule-api) builds the React frontend AND the Fastify API
# and serves both from the same origin, so there is nothing to wire up:
#   • no VITE_API_URL — the frontend calls same-origin /api
#   • no CORS / WEB_ORIGIN — it's all one origin
#   • no stable VAULT_KEY needed — the API generates + persists one in the DB
# After the first deploy, if the database is empty, seed it once from the
# service Shell:  node dist/db/seed.js
#
# Free-tier notes:
#   • No preDeployCommand on free plans → migrations run in the start command
#     (idempotent: the runner tracks schema_migrations).
#   • `npm install --include=dev` so tsc/vite (devDeps) are available even with
#     NODE_ENV=production.
#   • The background worker needs a PAID plan, so it's omitted — every core flow
#     (auth, teams, submissions, approvals, SSE) works without it.

databases:
  - name: capsule-db
    plan: free
    databaseName: capsule
    user: capsule

services:
  # ─── Redis (Render "Key Value") — cache, rate-limit, SSE pub/sub ──────────
  - type: keyvalue
    name: capsule-redis
    plan: free
    ipAllowList: [] # internal-only

  # ─── App: Fastify API + built React frontend, one origin ─────────────────
  - type: web
    name: capsule-api
    runtime: node
    plan: free
    rootDir: server
    # Build the API, then build the web app and copy its dist into server/public
    # so the API serves it at "/". Runs from server/ (rootDir).
    buildCommand: >-
      npm install --include=dev &&
      npm run build &&
      npm --prefix ../web install --include=dev &&
      npm --prefix ../web run build &&
      rm -rf public &&
      cp -r ../web/dist public
    # Migrations (idempotent) then boot; the server serves ./public if present.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: capsule-db, property: connectionString }
      - key: DATABASE_DIRECT_URL
        fromDatabase: { name: capsule-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: capsule-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PG_POOL_MAX
        value: "10"
      # VAULT_KEY is OPTIONAL — unset means the API generates one on first boot
      # and persists it in the DB (app_secrets), stable across deploys. Set it
      # (sync:false) only to manage the AES email key yourself; keep it stable.
      - key: VAULT_KEY
        sync: false

