# ─── Render Blueprint — Capsule Portal (free-tier friendly) ─────────────────
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick the repo.
# After the FIRST deploy, set the two `sync: false` vars (each needs the other
# service's URL, known only once they exist), then seed once (see bottom).
#
# Free-tier constraints handled here:
#   • No `preDeployCommand` on free plans → migrations run in the start command
#     instead (idempotent: the runner checks schema_migrations).
#   • `npm install --include=dev` so tsc/vite (devDeps) exist even though
#     NODE_ENV=production would otherwise skip them.
#   • The background worker needs a PAID plan, so it's omitted — it only does
#     out-of-band notification dispatch + portal sync, and every core flow
#     (auth, teams, submissions, approvals, SSE) works without it. To add it,
#     see the commented block at the bottom.

databases:
  - name: capsule-db
    plan: free
    databaseName: capsule
    user: capsule

services:
  # ─── Redis (Render "Key Value") — cache, rate-limit, SSE pub/sub ──────────
  - type: keyvalue
    name: capsule-redis
    plan: free
    ipAllowList: [] # internal-only

  # ─── API (Fastify) ───────────────────────────────────────────────────────
  - type: web
    name: capsule-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    # Runs migrations (idempotent) then boots the server — no pre-deploy needed.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: capsule-db, property: connectionString }
      - key: DATABASE_DIRECT_URL
        fromDatabase: { name: capsule-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: capsule-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_KEY
        sync: false # ← OPTIONAL. 64 hex chars (32-byte AES key for email encryption). If left unset, the API generates one on first boot and persists it in the DB (app_secrets) so it stays stable across deploys. Set it only to manage the secret yourself; if you do, it MUST stay stable. Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: PG_POOL_MAX
        value: "10"
      - key: WEB_ORIGIN
        sync: false # ← set to the static site URL, e.g. https://capsule-web.onrender.com (CORS)

  # ─── Frontend (Vite build, served as a static site) ──────────────────────
  - type: web
    name: capsule-web
    runtime: static
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # ← set to the API URL, e.g. https://capsule-api.onrender.com
    routes:
      - type: rewrite
        source: /* # SPA fallback so client-side routes resolve
        destination: /index.html

# ─── Seed once, after the first successful deploy ───────────────────────────
#   Render → capsule-api → Shell:   node dist/db/seed.js
#
# ─── Optional worker (needs a PAID plan; add under `services:` if you want it) ─
#   - type: worker
#     name: capsule-worker
#     runtime: node
#     plan: starter
#     rootDir: server
#     buildCommand: npm install --include=dev && npm run build
#     startCommand: node dist/worker.js
#     envVars:
#       - key: NODE_ENV
#         value: production
#       - key: DATABASE_URL
#         fromDatabase: { name: capsule-db, property: connectionString }
#       - key: REDIS_URL
#         fromService: { type: keyvalue, name: capsule-redis, property: connectionString }
