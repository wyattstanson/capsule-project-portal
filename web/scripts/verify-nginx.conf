server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + health + SSE to the Fastify API running on the host (Docker port 4000).
  location /api/ { proxy_pass http://host.docker.internal:4000; proxy_set_header Host $host; }
  location /health { proxy_pass http://host.docker.internal:4000; }
  location /events {
    proxy_pass http://host.docker.internal:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  # SPA fallback.
  location / { try_files $uri $uri/ /index.html; }
}
